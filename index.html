<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bit Benders - AI Legal Navigator</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4a90e2;
            --secondary: #5dade2;
            --accent: #3498db;
            --dark-bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #7d8590;
            --input-bg: #1c2128;
            --error-color: #ff4444;
            --approval-bg: #2a2218;
            --approval-border: #ffcc80;
            --sidebar-width: 280px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* ========== LOADING INTRO ========== */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--dark-bg);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .loading-screen.hidden {
            pointer-events: none;
        }

        .loading-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(74, 144, 226, 0.2) 0%, transparent 70%);
            animation: bgPulse 2s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .loading-logo-container {
            position: relative;
            z-index: 2;
            margin-bottom: 60px;
        }

        .loading-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff, var(--primary), var(--secondary), #ffffff);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: logoShine 2s ease-in-out infinite;
            letter-spacing: 4px;
            text-align: center;
        }

        @keyframes logoShine {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .loading-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 0 auto 30px;
            box-shadow: 0 0 60px rgba(74, 144, 226, 0.6);
            animation: iconFloat 2s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .loading-circles {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 40px;
        }

        .loading-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-top-color: var(--primary);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: spin 1.5s linear infinite;
        }

        .loading-circle:nth-child(2) {
            width: 80%;
            height: 80%;
            border-top-color: var(--secondary);
            animation-duration: 1s;
            animation-direction: reverse;
        }

        .loading-circle:nth-child(3) {
            width: 60%;
            height: 60%;
            border-top-color: var(--accent);
            animation-duration: 0.75s;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .loading-text {
            font-size: 1.3rem;
            color: var(--text-secondary);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            animation: textPulse 1.5s ease-in-out infinite;
        }

        @keyframes textPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .loading-progress {
            width: 300px;
            height: 4px;
            background: rgba(74, 144, 226, 0.2);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .loading-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
            width: 0%;
            animation: progressLoad 2s ease-in-out forwards;
            box-shadow: 0 0 20px rgba(74, 144, 226, 0.8);
        }

        @keyframes progressLoad {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .loading-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .loading-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary);
            border-radius: 50%;
            animation: particleRise 3s linear infinite;
            opacity: 0;
        }

        @keyframes particleRise {
            0% {
                transform: translateY(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-100vh) scale(1);
                opacity: 0;
            }
        }

        /* ========== MAIN CONTENT ========== */
        .main-wrapper {
            opacity: 0;
            transition: opacity 0.5s;
            display: flex;
        }

        .main-wrapper.visible {
            opacity: 1;
        }

        /* ========== CHAT HISTORY SIDEBAR ========== */
        .chat-history-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: rgba(22, 27, 34, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }

        .chat-history-sidebar.open {
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .sidebar-close {
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
        }

        .sidebar-close:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(90deg);
        }

        .new-chat-btn {
            margin: 15px;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(74, 144, 226, 0.4);
        }

        .chat-history-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .chat-history-list::-webkit-scrollbar {
            width: 6px;
        }

        .chat-history-list::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--primary), var(--secondary));
            border-radius: 3px;
        }

        .history-item {
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .history-item:hover {
            background: rgba(74, 144, 226, 0.1);
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .history-item.active {
            background: rgba(74, 144, 226, 0.15);
            border-color: var(--primary);
        }

        .history-item-title {
            font-size: 0.9rem;
            color: var(--text-primary);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item-date {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .sidebar-toggle {
            position: fixed;
            left: 20px;
            top: 20px;
            width: 45px;
            height: 45px;
            background: rgba(22, 27, 34, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.3rem;
            z-index: 999;
            transition: all 0.3s;
        }

        .sidebar-toggle:hover {
            background: rgba(74, 144, 226, 0.2);
            border-color: var(--primary);
            transform: scale(1.1);
        }

        /* Background */
        .background-layers {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: orbFloat 20s ease-in-out infinite;
        }

        .gradient-orb.orb1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(74, 144, 226, 0.4) 0%, transparent 70%);
            top: -10%;
            left: -10%;
        }

        .gradient-orb.orb2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(93, 173, 226, 0.3) 0%, transparent 70%);
            top: 50%;
            right: -5%;
            animation-delay: -7s;
        }

        .gradient-orb.orb3 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(52, 152, 219, 0.35) 0%, transparent 70%);
            bottom: -10%;
            left: 40%;
            animation-delay: -14s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(150px, -150px) scale(1.1); }
            66% { transform: translate(-100px, 150px) scale(0.9); }
        }

        .animated-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(74, 144, 226, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(74, 144, 226, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridScroll 30s linear infinite;
        }

        @keyframes gridScroll {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Container */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 2;
            width: 100%;
        }

        /* Navigation */
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(22, 27, 34, 0.4);
            backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(74, 144, 226, 0.1);
            border-radius: 20px;
            margin-bottom: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff, var(--primary), var(--secondary));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: logoShift 3s ease infinite;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        @keyframes logoShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .logo-icon {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.4);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .github-btn {
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .github-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: rgba(74, 144, 226, 0.1);
            border: 1px solid rgba(74, 144, 226, 0.3);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .logout-btn {
            padding: 6px 16px;
            background: rgba(255, 77, 77, 0.15);
            border: 1px solid rgba(255, 77, 77, 0.3);
            border-radius: 6px;
            color: #ff6b6b;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
        }

        .logout-btn:hover {
            background: rgba(255, 77, 77, 0.25);
            border-color: #ff6b6b;
            transform: translateY(-1px);
        }

        .theme-toggle {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.4s;
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(180deg);
            background: rgba(74, 144, 226, 0.2);
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 80px 20px 60px;
        }

        .hero-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 0%, var(--primary) 40%, var(--secondary) 70%, #ffffff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            letter-spacing: -2px;
            animation: titleGlow 4s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .hero-subtitle {
            font-size: 1.4rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        /* ========== CHAT INTERFACE ========== */
        .chat-container {
            max-width: 900px;
            margin: 60px auto;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
        }

        .chat-header {
            padding: 20px 30px;
            background: rgba(74, 144, 226, 0.1);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .chat-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4CAF50;
            border-radius: 50%;
            animation: dotPulse 2s ease-in-out infinite;
        }
        .status-dot.loading {
            background: #ffcc80;
            animation: dotLoading 1.5s linear infinite;
        }
        @keyframes dotLoading {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chat-messages {
            height: 500px;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--primary), var(--secondary));
            border-radius: 4px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 70%;
            animation: messageSlide 0.4s ease-out;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.ai {
            align-self: flex-start;
        }

        .message.user {
            align-self: flex-end;
        }
         .message.system {
            align-self: center;
            max-width: 90%;
            text-align: center;
            font-style: italic;
        }
        .message.error {
            align-self: center;
            max-width: 90%;
            text-align: center;
            color: var(--error-color);
            font-weight: bold;
        }
        .message.approval {
            align-self: center;
            max-width: 90%;
            background-color: var(--approval-bg);
            border: 1px solid var(--approval-border);
            border-radius: 12px;
            padding: 15px;
        }
         .message.approval button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 15px;
            margin: 10px 5px 0 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .message.approval button:hover {
            background: var(--accent);
        }
        .message.approval button:last-child {
            background: #6c757d;
        }
        .message.approval button:last-child:hover {
            background: #5a6268;
        }

        .message-content {
            padding: 15px 20px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .message.ai .message-content {
            background: rgba(74, 144, 226, 0.1);
            border: 1px solid rgba(74, 144, 226, 0.2);
            border-radius: 16px 16px 16px 4px;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 16px 16px 4px 16px;
        }
        .message.system .message-content,
        .message.error .message-content {
            background: transparent;
            color: var(--text-secondary);
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 5px;
            padding: 0 5px;
        }
        .message.system .message-time,
        .message.error .message-time,
        .message.approval .message-time {
             display: none;
        }

        /* File Message */
        .file-message {
            background: rgba(74, 144, 226, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .file-message:hover {
            background: rgba(74, 144, 226, 0.1);
            border-color: var(--primary);
        }

        .file-message-icon {
            font-size: 2rem;
        }

        .file-message-info {
            flex: 1;
        }

        .file-message-name {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 3px;
        }

        .file-message-size {
            font-size: 0.8rem;
            color: white;
        }

        /* Tool Status in AI message */
        .tool-status {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--border);
            line-height: 1.4;
        }
         .tool-status i { color: var(--accent); }

        /* Chat Input */
        .chat-input-container {
            padding: 20px 30px;
            background: rgba(28, 33, 40, 0.5);
            border-top: 1px solid var(--border);
            position: relative;
        }

        .chat-input-container.drag-over {
            background: rgba(74, 144, 226, 0.1);
            border-top-color: var(--primary);
        }

        .chat-input-container.drag-over::before {
            content: '📎 Drop your files here';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: var(--primary);
            font-weight: 600;
            pointer-events: none;
            z-index: 10;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .attached-files {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
            padding: 0;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .attached-files:not(:empty) {
            display: flex !important;
        }

        .attached-file {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(74, 144, 226, 0.1);
            border: 1px solid rgba(74, 144, 226, 0.2);
            border-radius: 8px;
            font-size: 0.85rem;
            white-space: nowrap;
            flex-shrink: 0;
        }

        @keyframes attachedFileSlide {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .attached-file-remove {
            cursor: pointer;
            color: var(--text-secondary);
            transition: color 0.2s;
        }

        .attached-file-remove:hover {
            color: #ff4444;
        }

        .chat-input {
            flex: 1;
            padding: 14px 18px;
            background: var(--input-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            resize: none;
            outline: none;
            max-height: 120px;
            transition: all 0.3s;
        }

        .chat-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .chat-actions {
            display: flex;
            gap: 8px;
        }

        .chat-btn {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
        }

        .chat-btn:hover {
            background: rgba(74, 144, 226, 0.2);
            border-color: var(--primary);
            transform: scale(1.05);
        }

        .chat-btn.voice {
            font-size: 1.1rem;
        }

        .chat-btn.voice.recording {
            background: rgba(255, 68, 68, 0.2);
            border-color: #ff4444;
            animation: recordingPulse 1.5s ease-in-out infinite;
        }

        @keyframes recordingPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(255, 68, 68, 0); }
        }

        .chat-btn.send {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
        }

        .chat-btn.send:hover {
            box-shadow: 0 8px 25px rgba(74, 144, 226, 0.4);
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            :root {
                --sidebar-width: 250px;
            }
            
            .loading-logo {
                font-size: 3rem;
            }
            .hero-title {
                font-size: 3rem;
            }
            .chat-container {
                margin: 30px 10px;
            }
            .chat-messages {
                height: 400px;
            }
            .message {
                max-width: 85%;
            }
            .sidebar-toggle {
                left: 10px;
                top: 10px;
            }
        }
    </style>
</head>
<body>

        <!-- Chat History Sidebar -->
        <div class="chat-history-sidebar" id="chatSidebar">

        <!-- Sidebar Toggle Button -->
        <div class="sidebar-toggle" id="sidebarToggle">☰</div>

        <div class="main-content">
            <div class="container">
                <nav class="nav">
                    <div class="logo">
                        <div class="logo-icon">⚡</div>
                        BIT BENDERS
                    </div>
                    <div class="nav-right">
                        <a href="#" class="github-btn" onclick="window.open('http://localhost:7860', '_blank'); return false;"
>
                            <span>🌐</span>
                            <span>AI Browser</span>
                        </a>
                        <a href="#" class="github-btn">
                            <span>🔗</span>
                            <span>GitHub</span>
                        </a>
                        <div class="user-info" id="userInfo" style="display: none;">
                            <span id="userEmail"></span>

                <section class="hero">

                <div class="chat-container">
                    <div class="chat-header">
                        <div class="chat-title">💬 Legal AI Assistant (<span id="sessionIdDisplay">New Session</span>)</div>

                            </div>

                    </div>

            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // ========== TOKEN PASSING & AUTHENTICATION CHECK ==========
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const email = params.get('email');

            if (token && email) {
                // If token is in URL, save it and clean the URL
                localStorage.setItem('auth_token', token);
                localStorage.setItem('user_email', email);
                // Use replaceState to clean the URL without reloading
                window.history.replaceState({}, document.title, "/");
            }

            const authToken = localStorage.getItem('auth_token');
            const userEmail = localStorage.getItem('user_email');

            if (!authToken) {
                // Redirect to login if not authenticated
                window.location.href = 'http://localhost:7860';

            } else {
                // Show user info
                const userInfoEl = document.getElementById('userInfo');
                const userEmailEl = document.getElementById('userEmail');
                if (userInfoEl && userEmailEl && userEmail) {
                    userEmailEl.textContent = userEmail;
                    userInfoEl.style.display = 'flex';
                }
            }

            // Logout functionality
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    localStorage.removeItem('auth_token');
                    localStorage.removeItem('user_email');
                    window.location.href = 'http://localhost:7860';
;
                });
            }
        });

        // ========== LOADING SCREEN ==========
        const loadingScreen = document.getElementById('loadingScreen');
        const mainWrapper = document.getElementById('mainWrapper');
        const loadingParticles = document.getElementById('loadingParticles');

        // Create loading particles
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'loading-particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 3 + 's';
            loadingParticles.appendChild(particle);
        }

        // Loading sequence
        setTimeout(() => {
            gsap.to(loadingScreen, {
                duration: 1,
                opacity: 0,
                scale: 0.95,
                ease: 'power3.inOut',
                onComplete: () => {
                    loadingScreen.classList.add('hidden');
                    loadingScreen.style.display = 'none';
                    mainWrapper.classList.add('visible');
                    initMainAnimations();
                    displayMessage('system','Enter query or upload files (PDF/Images).');
                    loadChatHistory();
                }
            });
        }, 2500);

        // ========== MAIN ANIMATIONS ==========
        function initMainAnimations() {
            const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
            tl.from('.nav', { duration: 0.8, y: -80, opacity: 0 })
              .from('.hero-title', { duration: 1, scale: 0.8, opacity: 0, ease: 'elastic.out(1, 0.5)' }, '-=0.3')
              .from('.hero-subtitle', { duration: 0.6, y: 30, opacity: 0 }, '-=0.5')
              .from('.chat-container', { duration: 1, y: 50, opacity: 0, scale: 0.95 }, '-=0.3');
        }

        // ========== PARTICLE SYSTEM ==========
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height;
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -10;
                this.speed = Math.random() * 1.5 + 0.5;
                this.size = Math.random() * 2.5 + 0.5;
                this.opacity = Math.random() * 0.6 + 0.2;
            }

            update() {
                this.y += this.speed;
                if (this.y > canvas.height + 10) this.reset();
            }

            draw() {
                ctx.fillStyle = `rgba(74, 144, 226, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        const particles = Array.from({ length: 80 }, () => new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        animateParticles();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // ========== SIDEBAR FUNCTIONALITY ==========
        const chatSidebar = document.getElementById('chatSidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebarClose = document.getElementById('sidebarClose');
        const newChatBtn = document.getElementById('newChatBtn');
        const chatHistoryList = document.getElementById('chatHistoryList');

        sidebarToggle.addEventListener('click', () => {
            chatSidebar.classList.toggle('open');
            gsap.from('.history-item', {
                duration: 0.3,
                x: -50,
                opacity: 0,
                stagger: 0.05,
                ease: 'power2.out'
            });
        });

        sidebarClose.addEventListener('click', () => {
            chatSidebar.classList.remove('open');
        });

        newChatBtn.addEventListener('click', () => {
            createNewChat();
        });

        async function loadChatHistory() {
            // Fetch user-specific chat sessions from backend
            const authToken = localStorage.getItem('auth_token');
            if (!authToken) {
                chatHistoryList.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-secondary);">Please login to view history</div>';
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/sessions`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`Failed to load chat history: ${response.status}`);
                }

                const result = await response.json();
                const sessions = result.sessions || [];
                
                if (sessions.length === 0) {
                    chatHistoryList.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-secondary);">No chat history yet</div>';
                } else {
                    renderChatHistory(sessions);
                }
            } catch (error) {
                console.error('Error loading chat history:', error);
                chatHistoryList.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--error-color);">Failed to load history</div>';
            }
        }

        function renderChatHistory(sessions) {
            chatHistoryList.innerHTML = '';
            sessions.forEach((session) => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.setAttribute('data-session-id', session.session_id);
                
                if (session.session_id === currentSessionId) {
                    item.classList.add('active');
                }
                
                const preview = session.preview || 'New Chat';
                const date = new Date(session.last_accessed).toLocaleDateString();
                
                item.innerHTML = `
                    <div class="history-item-title">${preview}</div>
                    <div class="history-item-date">${date}</div>
                `;
                item.addEventListener('click', () => loadSession(session.session_id));
                chatHistoryList.appendChild(item);
            });
        }

        function createNewChat() {
            currentSessionId = null;
            localStorage.removeItem('chatGSessionId');
            sessionIdDisplay.textContent = 'New Session';
            chatMessages.innerHTML = '';
            uploadedFiles = [];
            sessionFiles = [];
            attachedFiles.innerHTML = '';
            displayMessage('system','Enter query or upload files (PDF/Images).');
            chatSidebar.classList.remove('open');
            
            // Remove active class from all history items
            document.querySelectorAll('.history-item').forEach(item => {
                item.classList.remove('active');
            });
        }

        async function loadSession(sessionId) {
            const authToken = localStorage.getItem('auth_token');
            if (!authToken) {
                alert('Please login to load chat sessions');
                return;
            }

            try {
                // Fetch messages for this session
                const response = await fetch(`${API_BASE_URL}/api/sessions/${sessionId}/messages`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`Failed to load session: ${response.status}`);
                }

                const result = await response.json();
                const messages = result.messages || [];

                // Clear current chat
                chatMessages.innerHTML = '';
                uploadedFiles = [];
                sessionFiles = [];
                attachedFiles.innerHTML = '';
                
                // Set current session
                currentSessionId = sessionId;
                localStorage.setItem('chatGSessionId', sessionId);
                sessionIdDisplay.textContent = `ID: ${sessionId.substring(0, 8)}...`;

                // Display all messages in order
                messages.forEach(msg => {
                    displayMessage(msg.role, msg.content, msg.tool_status || []);
                });

                // Update active state in sidebar
                document.querySelectorAll('.history-item').forEach(item => {
                    item.classList.remove('active');
                });
                // Find and mark the current session as active
                chatHistoryList.querySelectorAll('.history-item').forEach(item => {
                    const title = item.querySelector('.history-item-title');
                    if (title) {
                        // We need to check if this is the right session
                        // We'll mark it by checking if it was just clicked
                        const clickedSession = item.getAttribute('data-session-id');
                        if (clickedSession === sessionId) {
                            item.classList.add('active');
                        }
                    }
                });

                // Close sidebar
                chatSidebar.classList.remove('open');

                // Scroll to bottom
                chatMessages.scrollTop = chatMessages.scrollHeight;

            } catch (error) {
                console.error('Error loading session:', error);
                alert('Failed to load chat session. Please try again.');
            }
        }

        // ========== VOICE INPUT ==========
        const voiceBtn = document.getElementById('voiceBtn');
        let recognition = null;
        let isRecording = false;

        // Check if browser supports speech recognition
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                chatInput.value += (chatInput.value ? ' ' : '') + transcript;
                chatInput.style.height = 'auto';
                chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
            };

            recognition.onend = () => {
                isRecording = false;
                voiceBtn.classList.remove('recording');
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                isRecording = false;
                voiceBtn.classList.remove('recording');
            };
        } else {
            voiceBtn.style.opacity = '0.5';
            voiceBtn.style.cursor = 'not-allowed';
            voiceBtn.title = 'Voice input not supported in this browser';
        }

        voiceBtn.addEventListener('click', () => {
            if (!recognition) {
                alert('Voice input is not supported in your browser. Please try Chrome or Edge.');
                return;
            }

            if (isRecording) {
                recognition.stop();
                isRecording = false;
                voiceBtn.classList.remove('recording');
            } else {
                recognition.start();
                isRecording = true;
                voiceBtn.classList.add('recording');
            }
        });

        // ========== THEME TOGGLE ==========
        const themeToggle = document.getElementById('themeToggle');
        let isLight = false;

        themeToggle.addEventListener('click', () => {
            isLight = !isLight;
            document.body.style.setProperty('--dark-bg', isLight ? '#f6f8fa' : '#0d1117');
            document.body.style.setProperty('--card-bg', isLight ? '#ffffff' : '#161b22');
            document.body.style.setProperty('--text-primary', isLight ? '#24292e' : '#e6edf3');
            document.body.style.setProperty('--text-secondary', isLight ? '#586069' : '#7d8590');
             document.body.style.setProperty('--border', isLight ? '#e1e4e8' : '#30363d');
             document.body.style.setProperty('--input-bg', isLight ? '#f6f8fa' : '#1c2128');
            themeToggle.textContent = isLight ? '☀️' : '🌙';
        });

        // ========== CHAT FUNCTIONALITY (MODIFIED for /chat-g) ==========
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const attachBtn = document.getElementById('attachBtn');
        const fileInput = document.getElementById('fileInput');
        const chatInputContainer = document.getElementById('chatInputContainer');
        const attachedFiles = document.getElementById('attachedFiles');
        const sessionIdDisplay = document.getElementById('sessionIdDisplay');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        const API_BASE_URL = 'http://localhost:7860';
        let currentSessionId = localStorage.getItem('chatGSessionId');
        let isWaitingForApproval = false;
        let pendingApprovalData = null;
        let uploadedFiles = [];
        let sessionFiles = [];

        if (currentSessionId) {
            sessionIdDisplay.textContent = `ID: ${currentSessionId.substring(0, 8)}...`;
        } else {
             sessionIdDisplay.textContent = 'New Session';
        }
        
        function updateSessionFilesDisplay() {
            if (sessionFiles.length > 0 && uploadedFiles.length === 0) {
                attachedFiles.innerHTML = sessionFiles.map((file) => `
                    <div class="attached-file" style="background: rgba(76, 175, 80, 0.1); border-color: rgba(76, 175, 80, 0.3);">
                        <span>📄</span>
                        <span title="${file.display_name}">${file.display_name.length > 20 ? file.display_name.substring(0,17)+'...' : file.display_name}</span>
                        <span style="color: #4CAF50; font-size: 0.8em; margin-left: 5px;">✓ In Context</span>
                    </div>
                `).join('');
            }
        }

        function setStatus(isLoading) {
             if (isLoading) {
                 statusDot.classList.add('loading');
                 statusText.textContent = 'Processing...';
             } else {
                 statusDot.classList.remove('loading');
                 statusText.textContent = 'Online';
             }
         }

        function displayMessage(role, content, toolStatus = [], isHtml = false) {
             const msgDiv = document.createElement('div');
             msgDiv.classList.add('message', role);

             const contentDiv = document.createElement('div');
             contentDiv.classList.add('message-content');

             if (isHtml) {
                 contentDiv.innerHTML = content;
             } else {
                 const safeContent = content.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                 contentDiv.textContent = safeContent;
             }
             msgDiv.appendChild(contentDiv);

            if (role === 'ai' && toolStatus && toolStatus.length > 0) {
                 const statusDiv = document.createElement('div');
                 statusDiv.classList.add('tool-status');
                 statusDiv.innerHTML = '<i>Tool Status:</i><br>' + toolStatus.map(s => `- ${s.replace(/</g, "&lt;").replace(/>/g, "&gt;")}`).join('<br>');
                 msgDiv.appendChild(statusDiv);
            }

             if (role === 'user' || role === 'ai') {
                 const timeDiv = document.createElement('div');
                 timeDiv.classList.add('message-time');
                 timeDiv.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                 msgDiv.appendChild(timeDiv);
             }

             chatMessages.appendChild(msgDiv);
             chatMessages.scrollTop = chatMessages.scrollHeight;
         }

        function displayApprovalRequest(data) {
             isWaitingForApproval = true;
             pendingApprovalData = data;

             let approvalHtml = `<strong>SYSTEM: Approval Required</strong><br>${data.response}<br><br>`;
             approvalHtml += `<strong>Tools requesting approval:</strong><ul>`;
             data.approval_requests.forEach((req) => {
                 approvalHtml += `<li>${req.approval_message}</li>`;
             });
             approvalHtml += `</ul>`;
             approvalHtml += `<button onclick="sendApproval(true)">Approve</button> `;
             approvalHtml += `<button onclick="sendApproval(false)">Reject</button>`;

             displayMessage('approval', approvalHtml, [], true);
         }

        async function sendApproval(approved) {
             if (!isWaitingForApproval || !pendingApprovalData) return;

             displayMessage('user', approved ? '[Approved]' : '[Rejected]');
             setStatus(true);
             isWaitingForApproval = false;

             try {
                 const response = await fetch(`${API_BASE_URL}/chat/approve`, {
                     method: 'POST',
                     headers: { 'Content-Type': 'application/json' },
                     body: JSON.stringify({
                         session_id: pendingApprovalData.session_id,
                         approved: approved,
                         agent_type: pendingApprovalData.approval_agent_type
                     })
                 });

                 const result = await response.json();
                 pendingApprovalData = null;

                 if (!response.ok) {
                     throw new Error(result.error || `HTTP error! Status: ${response.status}`);
                 }

                 if (result.action === 'BROWSER_REDIRECT') {
                     displayMessage('ai', `Okay, opening search for you: <a href="${result.url}" target="_blank">${result.url}</a>`, [], true);
                     window.open(result.url, '_blank');
                 } else {
                     displayMessage('ai', result.response || '', result.tool_status || []);
                 }

             } catch (error) {
                 console.error('Approval Error:', error);
                 displayMessage('error', `Error sending approval: ${error.message}`);
                 isWaitingForApproval = true;
             } finally {
                 setStatus(false);
             }
         }

        async function sendMessage() {
            if (isWaitingForApproval) {
                alert("Please approve or reject the pending tool request first.");
                return;
            }

            const query = chatInput.value.trim();
            const filesToSend = [...uploadedFiles];

            if (!query && filesToSend.length === 0) {
                alert("Please enter a query or attach a file.");
                return;
            }

             let userInputDisplay = query;
            if (filesToSend.length > 0) {
                 userInputDisplay += ` [Attached ${filesToSend.length} file(s)]`;
                 filesToSend.forEach(file => {
                     const fileMsgHtml = `
                        <div class="file-message">
                            <div class="file-message-icon">${getFileIcon(file.name)}</div>
                            <div class="file-message-info">
                                <div class="file-message-name">${file.name}</div>
                                <div class="file-message-size">${formatSize(file.size)}</div>
                            </div>
                        </div>`;
                     displayMessage('user', fileMsgHtml, [], true);
                 });
            }
             if (query) {
                 displayMessage('user', query);
                 // Save to history on first message
                 if (!currentSessionId && query) {
                     setTimeout(() => {
                         if (currentSessionId) {
                             saveChatToHistory(currentSessionId, query);
                         }
                     }, 1000);
                 }
             }

             setStatus(true);
             chatInput.value = '';
             chatInput.style.height = 'auto';
             uploadedFiles = [];
             attachedFiles.innerHTML = '';

             const formData = new FormData();
             formData.append('query', query);
             if (currentSessionId) {
                 formData.append('session_id', currentSessionId);
             }
             filesToSend.forEach((file) => {
                 formData.append('files', file);
             });

             try {
                 const authToken = localStorage.getItem('auth_token');
                 const headers = {};
                 if (authToken) {
                     headers['Authorization'] = `Bearer ${authToken}`;
                 }
                 
                 const response = await fetch(`${API_BASE_URL}/chat-g`, {
                     method: 'POST',
                     headers: headers,
                     body: formData
                 });

                 const result = await response.json();
                 
                 console.log('Response status:', response.status);
                 console.log('Result object:', result);

                  if (!response.ok) {
                     throw new Error(result.error || `HTTP error! Status: ${response.status}`);
                 }

                 if (result.session_id) {
                     if (currentSessionId !== result.session_id) {
                         console.log(`Session ID changed: ${currentSessionId || 'none'} -> ${result.session_id}`);
                         currentSessionId = result.session_id;
                         localStorage.setItem('chatGSessionId', currentSessionId);
                         sessionFiles = [];
                         // Reload chat history to show the new session
                         loadChatHistory();
                     }
                     sessionIdDisplay.textContent = `ID: ${currentSessionId.substring(0, 8)}...`;
                 }
                 
                 if (result.session_files) {
                     sessionFiles = result.session_files;
                     console.log('Session files updated:', sessionFiles);
                     updateSessionFilesDisplay();
                 } else if (filesToSend.length > 0) {
                     filesToSend.forEach(file => {
                         sessionFiles.push({
                             display_name: file.name,
                             mime_type: file.type,
                             uri: 'pending'
                         });
                     });
                     updateSessionFilesDisplay();
                 }

                 if (result.needs_approval) {
                     console.log('Handling approval request');
                     displayApprovalRequest(result);
                 } else if (result.action === 'BROWSER_REDIRECT') {
                     console.log('Handling browser redirect');
                     displayMessage('ai', `Okay, opening search for you: <a href="${result.url}" target="_blank">${result.url}</a>`, [], true);
                     window.open(result.url, '_blank');
                 } else {
                     console.log('Displaying AI response:', result.response);
                     displayMessage('ai', result.response || '', result.tool_status || []);
                 }

             } catch (error) {
                 console.error('Send Error:', error);
                 displayMessage('error', `Error: ${error.message}`);
             } finally {
                 setStatus(false);
             }
        }

        sendBtn.addEventListener('click', (event) => {
            event.preventDefault();
            sendMessage();
        });
        chatInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        attachBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
             handleFiles(Array.from(e.target.files));
             fileInput.value = '';
        });

        chatInputContainer.addEventListener('dragover', (e) => {
            e.preventDefault();
            chatInputContainer.classList.add('drag-over');
        });
        chatInputContainer.addEventListener('dragleave', (e) => {
            if (!chatInputContainer.contains(e.relatedTarget)) {
                chatInputContainer.classList.remove('drag-over');
            }
        });
        chatInputContainer.addEventListener('drop', (e) => {
            e.preventDefault();
            chatInputContainer.classList.remove('drag-over');
            handleFiles(Array.from(e.dataTransfer.files));
        });

        function handleFiles(files) {
             console.log('handleFiles called with:', files.length, 'files');
             const allowedTypes = ['application/pdf', 'image/png', 'image/jpeg', 'image/gif', 'image/webp'];
             const validFiles = files.filter(file => allowedTypes.includes(file.type));
             const invalidFiles = files.filter(file => !allowedTypes.includes(file.type));
             
             console.log('Valid files:', validFiles.length);
             console.log('Invalid files:', invalidFiles.length);

             if(invalidFiles.length > 0) {
                 alert(`Skipped invalid file types: ${invalidFiles.map(f => f.name).join(', ')}. Allowed: PDF, PNG, JPG, GIF, WEBP`);
             }

            uploadedFiles = [...uploadedFiles, ...validFiles];
            console.log('Total uploadedFiles after adding:', uploadedFiles.length);
            renderAttachedFiles();

            if(validFiles.length > 0) {
                requestAnimationFrame(() => {
                    const newFiles = document.querySelectorAll('.attached-file');
                    const startIndex = Math.max(0, newFiles.length - validFiles.length);
                    
                    for (let i = startIndex; i < newFiles.length; i++) {
                        gsap.fromTo(newFiles[i], 
                            { scale: 0.5, opacity: 0 }, 
                            { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(1.7)', delay: (i - startIndex) * 0.05 }
                        );
                    }
                });
            }
        }

        function renderAttachedFiles() {
            console.log('Rendering attached files. Count:', uploadedFiles.length);
            console.log('Files:', uploadedFiles.map(f => f.name));
            
            attachedFiles.innerHTML = uploadedFiles.map((file, i) => `
                <div class="attached-file">
                    <span>${getFileIcon(file.name)}</span>
                    <span title="${file.name}">${file.name.length > 20 ? file.name.substring(0,17)+'...' : file.name}</span>
                    <span class="attached-file-remove" onclick="removeAttachedFile(${i})" title="Remove ${file.name}">✕</span>
                </div>
            `).join('');
        }

        window.removeAttachedFile = function(index) {
            uploadedFiles.splice(index, 1);
            renderAttachedFiles();
        };

        window.sendApproval = sendApproval;

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
             const icons = {
                 'pdf': '📕',
                 'png': '🖼️', 'jpg': '🖼️', 'jpeg': '🖼️', 'gif': '🖼️', 'webp': '🖼️',
                 'doc': '📘', 'docx': '📘',
                 'txt': '📄'
             };
            return icons[ext] || '📄';
        }

        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${(bytes / Math.pow(k, i)).toFixed(1)} ${sizes[i]}`;
        }

        chatInput.addEventListener('input', () => {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
        });

    </script>
</body>
</html>
